# GPU/Vast-ready smoke on a CUDA VM:
# docker run --rm --gpus all -e SCENIC_S3_BUCKET=scenicdriver-data -e SCENIC_S3_ONLY=1 -e AWS_DEFAULT_REGION=us-east-1 -v "$PWD/data:/workspace/data" -v "$PWD/models:/workspace/models" -v "$PWD/cache:/workspace/cache" -v "$PWD/scenic_artifacts:/workspace/scenic_artifacts" scenicdriver/remote-training:local python scripts/remote/container_smoke.py --check-imports --device cuda
#
# Later intensive training uses the same image and existing modeling CLI contract:
# docker run --rm --gpus all -e SCENIC_S3_BUCKET=scenicdriver-data -e SCENIC_S3_ONLY=1 -e AWS_DEFAULT_REGION=us-east-1 -v "$PWD/data:/workspace/data" -v "$PWD/models:/workspace/models" -v "$PWD/cache:/workspace/cache" -v "$PWD/scenic_artifacts:/workspace/scenic_artifacts" scenicdriver/remote-training:local python scripts/modeling/run_regression_pipeline.py --device cuda
services:
  remote-training:
    build:
      context: .
      dockerfile: Dockerfile.remote-training
    image: scenicdriver/remote-training:local
    working_dir: /workspace
    environment:
      - SCENIC_S3_BUCKET
      - SCENIC_S3_ONLY
      - AWS_DEFAULT_REGION
      - AWS_REGION
      - AWS_PROFILE
      - CUDA_VISIBLE_DEVICES
      - PYTHONUNBUFFERED
    volumes:
      - ./data:/workspace/data
      - ./models:/workspace/models
      - ./cache:/workspace/cache
      - ./scenic_artifacts:/workspace/scenic_artifacts
    command:
      - python
      - scripts/remote/container_smoke.py
      - --check-imports
      - --device
      - auto
