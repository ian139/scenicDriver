<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="profile-bottlenecks-title profile-bottlenecks-desc">
<title id="profile-bottlenecks-title">Observed bottleneck attribution</title>
<desc id="profile-bottlenecks-desc">Sampling attributed most request samples to native compact search, with heap pop accounting for over half of total samples; these are observed sample shares, not a complete additive decomposition.</desc>
<defs><pattern id="diagonal-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#1f2933" stroke-width="2"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f2933"/></marker></defs>
<rect x="0.0" y="0.0" width="1200.0" height="720.0" rx="0.0" fill="#fffdf8" stroke="none" />
<g aria-label="Research figure">
<text x="64.0" y="66.0" text-anchor="start" style="font-family:Georgia, 'Times New Roman', serif;font-size:29px;font-weight:bold;fill:#1f2933;">Observed bottleneck attribution</text>
<text x="64.0" y="96.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:15px;font-weight:normal;fill:#52616b;">Observed sample shares identify where further uncached-search research must begin.</text>
<line x1="64.0" y1="116.0" x2="1136.0" y2="116.0" stroke="#c8c4ba" stroke-width="1.5"/>
<line x1="310.0" y1="180.0" x2="310.0" y2="410.0" stroke="#e1ddd3" stroke-width="1.5"/>
<text x="310.0" y="434.0" text-anchor="middle" style="font-family:Arial, Helvetica, sans-serif;font-size:12px;font-weight:normal;fill:#52616b;">0%</text>
<line x1="450.0" y1="180.0" x2="450.0" y2="410.0" stroke="#e1ddd3" stroke-width="1.5"/>
<text x="450.0" y="434.0" text-anchor="middle" style="font-family:Arial, Helvetica, sans-serif;font-size:12px;font-weight:normal;fill:#52616b;">20%</text>
<line x1="590.0" y1="180.0" x2="590.0" y2="410.0" stroke="#e1ddd3" stroke-width="1.5"/>
<text x="590.0" y="434.0" text-anchor="middle" style="font-family:Arial, Helvetica, sans-serif;font-size:12px;font-weight:normal;fill:#52616b;">40%</text>
<line x1="730.0" y1="180.0" x2="730.0" y2="410.0" stroke="#e1ddd3" stroke-width="1.5"/>
<text x="730.0" y="434.0" text-anchor="middle" style="font-family:Arial, Helvetica, sans-serif;font-size:12px;font-weight:normal;fill:#52616b;">60%</text>
<line x1="870.0" y1="180.0" x2="870.0" y2="410.0" stroke="#e1ddd3" stroke-width="1.5"/>
<text x="870.0" y="434.0" text-anchor="middle" style="font-family:Arial, Helvetica, sans-serif;font-size:12px;font-weight:normal;fill:#52616b;">80%</text>
<line x1="1010.0" y1="180.0" x2="1010.0" y2="410.0" stroke="#e1ddd3" stroke-width="1.5"/>
<text x="1010.0" y="434.0" text-anchor="middle" style="font-family:Arial, Helvetica, sans-serif;font-size:12px;font-weight:normal;fill:#52616b;">100%</text>
<text x="64.0" y="226.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:19px;font-weight:bold;fill:#1f2933;">Native compact search</text>
<text x="64.0" y="250.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:13px;font-weight:normal;fill:#52616b;">observed share</text>
<rect x="310.0" y="205.0" width="627.2" height="50.0" rx="3.0" fill="#287271" stroke="none" />
<rect x="932.2" y="205.0" width="5.0" height="50.0" rx="0.0" fill="url(#diagonal-hatch)" stroke="none" />
<text x="951.2" y="238.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:22px;font-weight:bold;fill:#287271;">89.6%</text>
<text x="64.0" y="341.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:19px;font-weight:bold;fill:#1f2933;">Heap pop</text>
<text x="64.0" y="365.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:13px;font-weight:normal;fill:#52616b;">observed share</text>
<rect x="310.0" y="320.0" width="402.5" height="50.0" rx="3.0" fill="#b85c38" stroke="none" />
<rect x="707.5" y="320.0" width="5.0" height="50.0" rx="0.0" fill="url(#diagonal-hatch)" stroke="none" />
<text x="726.5" y="353.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:22px;font-weight:bold;fill:#b85c38;">57.5%</text>
<rect x="64.0" y="480.0" width="970.0" height="104.0" rx="6.0" fill="#f7f5ef" stroke="#c8c4ba" />
<text x="88.0" y="513.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:16px;font-weight:bold;fill:#1f2933;">Do not add these shares</text>
<text x="88.0" y="541.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:14px;font-weight:normal;fill:#52616b;">Heap pop is a component of native compact search; these are sampled attributions, not a partition of all work.</text>
<text x="88.0" y="568.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:14px;font-weight:normal;fill:#52616b;">No remaining non-artifact method had measured evidence for a repeatable 5% gain when the cap fired.</text>
<rect x="64.0" y="650.0" width="1072.0" height="42.0" rx="4.0" fill="#f7f5ef" stroke="#c8c4ba" />
<text x="80.0" y="675.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:12px;font-weight:normal;fill:#52616b;">Source: docs/research/routing-performance-autoresearch.md (profile).</text>
<text x="1120.0" y="675.0" text-anchor="end" style="font-family:Arial, Helvetica, sans-serif;font-size:12px;font-weight:normal;fill:#52616b;">Apple M2 Max; 12 logical CPUs; 32 GiB RAM</text>
</g>
</svg>
