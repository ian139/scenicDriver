<text x="106.0" y="257.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:13px;font-weight:normal;fill:#52616b;">Burlington → Pittsburgh</text>
<rect x="336.0" y="180.0" width="212.0" height="120.0" rx="6.0" fill="#f7f5ef" stroke="#287271" />
<rect x="336.0" y="180.0" width="9.0" height="120.0" rx="0.0" fill="#287271" stroke="none" />
