<text x="190.0" y="303.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:12px;font-weight:normal;fill:#52616b;">60.8398, 62.6824, 65.7794 s</text>
<text x="64.0" y="347.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:14px;font-weight:bold;fill:#1f2933;">Final confirmation — noisy host</text>
