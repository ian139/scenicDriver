<path d="M698.7,347.0 L706.7,355.0 L698.7,363.0 L690.7,355.0 Z" fill="#b85c38"/>
<path d="M631.7,347.0 L639.7,355.0 L631.7,363.0 L623.7,355.0 Z" fill="#b85c38"/>
<text x="190.0" y="383.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:12px;font-weight:normal;fill:#52616b;">82.3048, 114.4851, 92.076, 70.9841, 61.6257 s</text>
<text x="64.0" y="427.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:14px;font-weight:bold;fill:#1f2933;">Response-cache hit — operational only</text>
<text x="64.0" y="447.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:12px;font-weight:normal;fill:#52616b;">n=1</text>
<line x1="185.9" y1="429.0" x2="197.9" y2="441.0" stroke="#71808c" stroke-width="3.0"/>
<line x1="185.9" y1="441.0" x2="197.9" y2="429.0" stroke="#71808c" stroke-width="3.0"/>
<text x="190.0" y="463.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:12px;font-weight:normal;fill:#52616b;">0.2663 s</text>
<rect x="64.0" y="535.0" width="996.0" height="76.0" rx="5.0" fill="#f7f5ef" stroke="#c8c4ba" />
<text x="84.0" y="564.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:14px;font-weight:bold;fill:#b85c38;">Interpretation boundary</text>
<text x="84.0" y="589.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:13px;font-weight:normal;fill:#52616b;">Wide final-confirmation distribution retained under high same-host load; do not replace it with the best isolated result.</text>
<text x="84.0" y="608.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:13px;font-weight:normal;fill:#52616b;">Response-cache hit (0.2663 s) is operational evidence only, not an uncached-search improvement.</text>
