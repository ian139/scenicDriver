<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="latency-distributions-title latency-distributions-desc">
<title id="latency-distributions-title">Latency evidence, kept in its measurement context</title>
<desc id="latency-distributions-desc">Three cache-empty distributions and one operational response-cache hit are separated; the 20-second research target is shown without conflating cache hits with search improvements.</desc>
<defs><pattern id="diagonal-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#1f2933" stroke-width="2"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f2933"/></marker></defs>
<rect x="0.0" y="0.0" width="1200.0" height="720.0" rx="0.0" fill="#fffdf8" stroke="none" />
<g aria-label="Research figure">
<text x="64.0" y="66.0" text-anchor="start" style="font-family:Georgia, 'Times New Roman', serif;font-size:29px;font-weight:bold;fill:#1f2933;">Latency evidence, kept in its measurement context</text>
<text x="64.0" y="96.0" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:15px;font-weight:normal;fill:#52616b;">Cache-empty distributions and the separate response-cache-hit observation share an honest zero-based axis.</text>
