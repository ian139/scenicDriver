name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.16"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Sync project and test dependencies from the checked-in lockfile.
      - name: Install locked Python dependencies
        run: uv sync --frozen --extra dev

      - name: Run Python tests
        run: uv run pytest -q

      - name: Run viewer tests
        run: node --test tests/test_new_england_north_viewer.mjs
