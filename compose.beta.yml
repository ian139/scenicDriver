services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.beta-api
    environment:
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN}
    expose:
      - "8080"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models:/app/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8080/v1/healthz")
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - beta

  web:
    build:
      context: .
      dockerfile: apps/new_england_north/Dockerfile.beta-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${SCENIC_WEB_PORT:-80}:80"
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - beta

networks:
  beta:
    driver: bridge
