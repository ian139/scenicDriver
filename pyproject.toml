[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "progno"
version = "0.1.0"
description = "AI-powered scenic route planning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ian", email = "ian@example.com"}
]
keywords = ["scenic", "routing", "computer-vision", "machine-learning", "geospatial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "timm>=1.0.24",
    "torch>=2.0.0,<3",
    "torchvision>=0.15.0,<1",
    "numpy<2",
    "pandas>=2.3.3",
    "marimo>=0.19.7",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "transformers>=4.30.0",
    "scikit-learn>=1.3.0",
    "opencv-python>=4.8.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "boto3>=1.28.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=4.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
]
geo = [
    "rasterio>=1.3.0",
    "osmnx>=1.9.3",
]

[project.urls]
Homepage = "https://github.com/ian139/progno"
Repository = "https://github.com/ian139/progno"
Issues = "https://github.com/ian139/progno/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.venv
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long (handled by black)
exclude = [".git", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
