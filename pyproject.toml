[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scenicdriver"
version = "0.1.0"
description = "Scenic route planning with imagery + terrain ML"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2",
  "pillow>=10.0",
  "marimo>=0.19.7",
  "msgspec>=0.20,<1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0.24",
  "boto3>=1.34",
  "requests>=2.31",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
  "black>=24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
