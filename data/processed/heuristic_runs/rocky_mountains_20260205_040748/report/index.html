<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heuristic Scoring Report</title>
    <style>
      :root {
        --bg: #0f1a1c;
        --panel: #162326;
        --accent: #ffb347;
        --accent-2: #7bdff2;
        --text: #e4f2f2;
        --muted: #9bb4b4;
      }
      body {
        margin: 0;
        font-family: "Space Grotesk", "Fira Sans", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #1c2f33, #0f1a1c 55%);
        color: var(--text);
      }
      .container {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 16px;
        padding: 24px;
      }
      .card {
        background: var(--panel);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      h1, h2, h3 {
        margin: 0 0 12px 0;
        font-weight: 600;
      }
      h1 {
        font-size: 24px;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }
      .summary-item {
        background: rgba(255, 255, 255, 0.04);
        padding: 10px;
        border-radius: 8px;
      }
      .summary-item span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .summary-item strong {
        font-size: 18px;
      }
      #heatmap {
        width: 100%;
        height: 420px;
        background: #0a1112;
        border-radius: 8px;
      }
      #region-map {
        width: 100%;
        height: 180px;
        background: #0a1112;
        border-radius: 8px;
        margin-top: 8px;
      }
      #heatmap-wrap {
        position: relative;
      }
      #heatmap-tooltip {
        position: absolute;
        pointer-events: none;
        background: rgba(15, 26, 28, 0.9);
        color: var(--text);
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: none;
        z-index: 10;
      }
      #histogram {
        width: 100%;
        height: 200px;
      }
      .panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .nav {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .nav button {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .nav button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .tile-preview {
        width: 100%;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .muted {
        color: var(--muted);
      }
      .breakdown {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px;
      }
      .pill {
        background: rgba(123, 223, 242, 0.12);
        color: var(--accent-2);
        border-radius: 999px;
        padding: 4px 10px;
        display: inline-block;
        font-size: 12px;
      }
      @media (max-width: 900px) {
        .container {
          grid-template-columns: 1fr;
        }
        #heatmap {
          height: 320px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Heuristic Scoring Report</h1>
        <div class="summary-grid" id="summary"></div>
        <h3>Score Histogram</h3>
        <canvas id="histogram"></canvas>
        <h3>Spatial Heatmap</h3>
        <div id="heatmap-wrap">
          <canvas id="heatmap"></canvas>
          <div id="heatmap-tooltip"></div>
        </div>
        <div class="muted" id="heatmap-note"></div>
        <h3>Region Map</h3>
        <canvas id="region-map"></canvas>
        <div class="muted" id="region-info"></div>
      </div>
      <div class="card panel">
        <h2>Tile Details</h2>
        <div class="nav">
          <button id="prev-tile">Prev</button>
          <button id="next-tile">Next</button>
          <div class="pill" id="tile-id">Select a tile</div>
        </div>
        <img id="tile-thumb" class="tile-preview" src="" alt="tile thumbnail" />
        <div id="tile-score"></div>
        <div class="breakdown" id="tile-breakdown"></div>
        <div class="muted" id="tile-path"></div>
        <div class="muted">Use heatmap clicks or arrow keys to navigate.</div>
      </div>
    </div>
    <script>
      const summaryEl = document.getElementById("summary");
      const histogramCanvas = document.getElementById("histogram");
      const heatmapCanvas = document.getElementById("heatmap");
      const heatmapTooltip = document.getElementById("heatmap-tooltip");
      const heatmapNote = document.getElementById("heatmap-note");
      const regionMapCanvas = document.getElementById("region-map");
      const regionInfo = document.getElementById("region-info");
      const tileIdEl = document.getElementById("tile-id");
      const tileThumbEl = document.getElementById("tile-thumb");
      const tileScoreEl = document.getElementById("tile-score");
      const tileBreakdownEl = document.getElementById("tile-breakdown");
      const tilePathEl = document.getElementById("tile-path");
      const prevBtn = document.getElementById("prev-tile");
      const nextBtn = document.getElementById("next-tile");

      const colorStops = [
        { t: 0.0, c: [20, 50, 90] },
        { t: 0.35, c: [50, 160, 140] },
        { t: 0.6, c: [240, 200, 90] },
        { t: 0.8, c: [240, 140, 70] },
        { t: 1.0, c: [220, 60, 60] },
      ];

      const colorForScore = (score) => {
        const t = Math.min(1, Math.max(0, score / 10));
        for (let i = 0; i < colorStops.length - 1; i++) {
          const a = colorStops[i];
          const b = colorStops[i + 1];
          if (t >= a.t && t <= b.t) {
            const span = (t - a.t) / (b.t - a.t);
            const r = Math.round(a.c[0] + span * (b.c[0] - a.c[0]));
            const g = Math.round(a.c[1] + span * (b.c[1] - a.c[1]));
            const bcol = Math.round(a.c[2] + span * (b.c[2] - a.c[2]));
            return `rgb(${r}, ${g}, ${bcol})`;
          }
        }
        return "rgb(200, 200, 200)";
      };

      let tiles = [];
      let currentIndex = 0;
      let pixelIndex = {};
      let view = null;
      let zoomed = false;
      let gridBounds = null;
      let regionName = "unknown";

      fetch("report.json")
        .then((resp) => resp.json())
        .then((data) => {
          renderSummary(data.summary, data.run_info);
          renderHistogram(data.histogram);
          tiles = data.tiles || [];
          regionName = inferRegionName(tiles);
          renderHeatmap(data);
          renderRegionMap();
          if (tiles.length > 0) {
            setTile(tiles[0]);
          }
        });

      function renderSummary(summary, runInfo) {
        const items = [
          ["Total Tiles", summary.total_tiles],
          ["Mean Score", summary.mean.toFixed(2)],
          ["Median Score", summary.median.toFixed(2)],
          ["Std Dev", summary.std.toFixed(2)],
          ["Min Score", summary.min.toFixed(2)],
          ["Max Score", summary.max.toFixed(2)],
          ["Classifier", runInfo.used_classifier ? "on" : "off"],
          ["Device", runInfo.device],
          ["Missing Pairs", runInfo.counts.missing_pairs],
        ];
        summaryEl.innerHTML = items
          .map(([label, value]) => {
            return `<div class="summary-item"><span>${label}</span><strong>${value}</strong></div>`;
          })
          .join("");
      }

      function renderHistogram(histogram) {
        const ctx = histogramCanvas.getContext("2d");
        const width = histogramCanvas.clientWidth;
        const height = histogramCanvas.clientHeight;
        histogramCanvas.width = width;
        histogramCanvas.height = height;
        ctx.clearRect(0, 0, width, height);

        const counts = histogram.counts;
        const maxCount = Math.max(...counts, 1);
        const barWidth = width / counts.length;

        counts.forEach((count, idx) => {
          const barHeight = (count / maxCount) * (height - 20);
          ctx.fillStyle = colorForScore((idx / counts.length) * 10);
          ctx.fillRect(idx * barWidth, height - barHeight, barWidth - 2, barHeight);
        });
      }

      function renderHeatmap(data) {
        const grid = data.grid;
        if (!grid.has_coords) {
          heatmapNote.textContent =
            "Spatial coordinates unavailable; heatmap disabled. Check tile naming conventions.";
          return;
        }

        tiles = data.tiles || [];
        const gridW = grid.max_x - grid.min_x + 1;
        const gridH = grid.max_y - grid.min_y + 1;
        const maxDim = 512;
        const baseScale = Math.max(1, Math.ceil(Math.max(gridW, gridH) / maxDim));

        gridBounds = {
          minX: grid.min_x,
          maxX: grid.max_x,
          minY: grid.min_y,
          maxY: grid.max_y,
          baseScale,
        };

        const ctx = heatmapCanvas.getContext("2d");
        view = {
          minX: grid.min_x,
          maxX: grid.max_x,
          minY: grid.min_y,
          maxY: grid.max_y,
        };

        drawHeatmap(ctx, baseScale);
        renderRegionMap();

        heatmapCanvas.addEventListener("click", (event) => {
          const hit = pickTile(event);
          if (hit !== null) {
            setTile(tiles[hit]);
          }
        });

        heatmapCanvas.addEventListener("dblclick", (event) => {
          if (!gridBounds) return;
          const hit = pickTile(event);
          if (hit === null) {
            return;
          }

          if (!zoomed) {
            const tile = tiles[hit];
            const viewW = Math.max(4, Math.floor((gridBounds.maxX - gridBounds.minX + 1) / 2));
            const viewH = Math.max(4, Math.floor((gridBounds.maxY - gridBounds.minY + 1) / 2));
            view = {
              minX: Math.max(gridBounds.minX, tile.x - Math.floor(viewW / 2)),
              maxX: Math.min(gridBounds.maxX, tile.x + Math.floor(viewW / 2)),
              minY: Math.max(gridBounds.minY, tile.y - Math.floor(viewH / 2)),
              maxY: Math.min(gridBounds.maxY, tile.y + Math.floor(viewH / 2)),
            };
            zoomed = true;
          } else {
            view = {
              minX: gridBounds.minX,
              maxX: gridBounds.maxX,
              minY: gridBounds.minY,
              maxY: gridBounds.maxY,
            };
            zoomed = false;
          }
          drawHeatmap(ctx, gridBounds.baseScale);
        });

        heatmapCanvas.addEventListener("mousemove", (event) => {
          const hit = pickTile(event);
          if (hit === null) {
            heatmapTooltip.style.display = "none";
            return;
          }
          const tile = tiles[hit];
          const rect = heatmapCanvas.getBoundingClientRect();
          heatmapTooltip.style.left = `${event.clientX - rect.left + 12}px`;
          heatmapTooltip.style.top = `${event.clientY - rect.top + 12}px`;
          heatmapTooltip.textContent = `${tile.class_name || "unknown"} · ${tile.scenic_score.toFixed(
            2
          )}`;
          heatmapTooltip.style.display = "block";
        });
        heatmapCanvas.addEventListener("mouseleave", () => {
          heatmapTooltip.style.display = "none";
        });
      }

      function drawHeatmap(ctx, baseScale) {
        const viewW = view.maxX - view.minX + 1;
        const viewH = view.maxY - view.minY + 1;
        const scale = Math.max(1, Math.ceil(Math.max(viewW, viewH) / 512));
        heatmapCanvas.width = Math.ceil(viewW / scale);
        heatmapCanvas.height = Math.ceil(viewH / scale);
        ctx.clearRect(0, 0, heatmapCanvas.width, heatmapCanvas.height);

        pixelIndex = {};
        tiles.forEach((tile) => {
          if (
            tile.x < view.minX ||
            tile.x > view.maxX ||
            tile.y < view.minY ||
            tile.y > view.maxY
          ) {
            return;
          }

          const px = Math.floor((tile.x - view.minX) / scale);
          const py = Math.floor((tile.y - view.minY) / scale);
          const key = `${px},${py}`;
          if (!(key in pixelIndex)) {
            pixelIndex[key] = tile.index;
          } else if (tile.scenic_score > tiles[pixelIndex[key]].scenic_score) {
            pixelIndex[key] = tile.index;
          }
          ctx.fillStyle = colorForScore(tile.scenic_score);
          ctx.fillRect(px, py, 1, 1);
        });
      }

      function pickTile(event) {
          const rect = heatmapCanvas.getBoundingClientRect();
          const scaleX = heatmapCanvas.width / rect.width;
          const scaleY = heatmapCanvas.height / rect.height;
          const x = Math.floor((event.clientX - rect.left) * scaleX);
          const y = Math.floor((event.clientY - rect.top) * scaleY);
          const key = `${x},${y}`;
          const idx = pixelIndex[key];
          return idx === undefined ? null : idx;
      }

      function renderRegionMap() {
        if (!gridBounds || tiles.length === 0) {
          regionInfo.textContent = "Region info unavailable.";
          return;
        }
        const ctx = regionMapCanvas.getContext("2d");
        const gridW = gridBounds.maxX - gridBounds.minX + 1;
        const gridH = gridBounds.maxY - gridBounds.minY + 1;
        const scale = Math.max(1, Math.ceil(Math.max(gridW, gridH) / 256));
        regionMapCanvas.width = Math.ceil(gridW / scale);
        regionMapCanvas.height = Math.ceil(gridH / scale);
        ctx.clearRect(0, 0, regionMapCanvas.width, regionMapCanvas.height);

        ctx.fillStyle = "rgba(123, 223, 242, 0.35)";
        tiles.forEach((tile) => {
          const px = Math.floor((tile.x - gridBounds.minX) / scale);
          const py = Math.floor((tile.y - gridBounds.minY) / scale);
          ctx.fillRect(px, py, 1, 1);
        });

        if (tiles[currentIndex]) {
          const tile = tiles[currentIndex];
          const px = Math.floor((tile.x - gridBounds.minX) / scale);
          const py = Math.floor((tile.y - gridBounds.minY) / scale);
          ctx.fillStyle = "rgba(255, 179, 71, 0.95)";
          ctx.fillRect(px - 1, py - 1, 3, 3);
        }

        regionInfo.textContent = `Region: ${regionName} · z${tiles[0].z} · x ${gridBounds.minX}-${gridBounds.maxX} · y ${gridBounds.minY}-${gridBounds.maxY}`;
      }

      function inferRegionName(tileList) {
        if (!tileList || tileList.length === 0) return "unknown";
        const parts = (tileList[0].image_path || "").split("/");
        const zIndex = parts.findIndex((p) => p.startsWith("z"));
        if (zIndex !== -1 && parts.length > zIndex + 1) {
          return parts[zIndex + 1].replace(/_/g, " ");
        }
        return "unknown";
      }

      function setTile(tile) {
        currentIndex = tile.index;
        tileIdEl.textContent = `Tile ${tile.index + 1} / ${tiles.length}`;
        tileThumbEl.src = tile.thumb || "";
        tileScoreEl.innerHTML = `<strong>Score:</strong> ${tile.scenic_score.toFixed(
          2
        )} <span class="muted">(class: ${
          tile.class_name || "unknown"
        }, class score: ${Number(tile.class_score).toFixed(2)})</span>`;

        const breakdown = [
          ["Relief", tile.relief],
          ["Roughness", tile.roughness],
          ["Slope Mean", tile.slope_mean],
          ["Water Proxy", tile.water_proxy],
          ["Veg Proxy", tile.veg_proxy],
          ["Class Score", tile.class_score],
        ];
        tileBreakdownEl.innerHTML = breakdown
          .map(([label, value]) => {
            return `<div class="summary-item"><span>${label}</span><strong>${Number(
              value
            ).toFixed(3)}</strong></div>`;
          })
          .join("");
        tilePathEl.textContent = tile.image_path;
        prevBtn.disabled = currentIndex <= 0;
        nextBtn.disabled = currentIndex >= tiles.length - 1;
        renderRegionMap();
      }

      prevBtn.addEventListener("click", () => {
        if (currentIndex > 0) {
          setTile(tiles[currentIndex - 1]);
        }
      });
      nextBtn.addEventListener("click", () => {
        if (currentIndex < tiles.length - 1) {
          setTile(tiles[currentIndex + 1]);
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") {
          prevBtn.click();
        }
        if (event.key === "ArrowRight") {
          nextBtn.click();
        }
      });
    </script>
  </body>
</html>
