<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScenicDrive MVP</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="card controls">
        <h1>ScenicDrive MVP</h1>
        <p class="muted">Plan scenic vs baseline routes by region.</p>

        <label>API Base URL
          <input id="apiBase" value="http://localhost:8080" />
        </label>

        <label>Region
          <select id="region"></select>
        </label>

        <label>Input Mode
          <select id="inputMode">
            <option value="coords">Coordinates</option>
            <option value="address">Street Addresses</option>
          </select>
        </label>

        <div class="grid2">
          <label class="coords-only">Start Lat
            <input id="startLat" value="40.03" />
          </label>
          <label class="coords-only">Start Lon
            <input id="startLon" value="-75.22" />
          </label>
          <label class="coords-only">End Lat
            <input id="endLat" value="40.065" />
          </label>
          <label class="coords-only">End Lon
            <input id="endLon" value="-75.19" />
          </label>
          <label class="addr-only hidden">Start Address
            <input id="startAddress" list="startSuggestions" value="30th Street Station, Philadelphia, PA" />
            <datalist id="startSuggestions"></datalist>
          </label>
          <label class="addr-only hidden">End Address
            <input id="endAddress" list="endSuggestions" value="Philadelphia International Airport, Philadelphia, PA" />
            <datalist id="endSuggestions"></datalist>
          </label>
        </div>

        <label>Scenic Weight: <span id="weightValue">0.8</span>
          <input id="scenicWeight" type="range" min="0" max="1" step="0.05" value="0.8" />
        </label>

        <button id="planBtn">Plan Route</button>
        <pre id="status"></pre>
      </section>

      <section class="card map-card">
        <div id="map"></div>
        <div class="metrics" id="metrics"></div>
      </section>
    </main>

    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
