<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Masswhites Scenic Surface</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=demo-modules-v2" />
  </head>
  <body>
    <main class="app-shell">
      <section class="map-stage">
        <div id="map"></div>
        <canvas id="scenicCanvas" class="scenic-canvas" aria-hidden="true"></canvas>
        <div id="heatmapLegend" class="heatmap-legend hidden" aria-label="Scenic layer legend">
          <span>Lower</span>
          <div class="heatmap-legend-scale"></div>
          <span>Higher</span>
        </div>
        <button id="menuBtn" class="map-menu map-menu-right" type="button">Layers</button>
        <div id="loadingOverlay" class="loading-overlay hidden">
          <div class="loading-spinner"></div>
          <div class="loading-text">Planning route...</div>
        </div>

        <aside class="planner-shell" data-panel="search">
          <div class="brand-row">
            <div class="brand-lockup">
              <div class="brand-mark" aria-hidden="true">MW</div>
              <div>
                <div class="brand-title">Masswhites</div>
                <div class="brand-sub">Scenic Surface Demo</div>
              </div>
            </div>
            <span id="regionBadge" class="brand-pill">Demo</span>
          </div>
          <div class="demo-readout" aria-label="Demo summary">
            <div>
              <span>Surface</span>
              <strong>ML v5</strong>
            </div>
            <div>
              <span>Region</span>
              <strong>Masswhites</strong>
            </div>
            <div>
              <span>Layer</span>
              <strong>Static cells</strong>
            </div>
          </div>
          <div class="search-stack addr-only">
            <div class="search-field">
              <span class="search-label">From</span>
              <input id="startAddress" placeholder="Search start address" autocomplete="off" value="Pittsfield, Massachusetts" />
              <div id="startSuggestBox" class="suggest-box hidden"></div>
            </div>
            <div class="search-field">
              <span class="search-label">To</span>
              <input id="endAddress" placeholder="Search destination" autocomplete="off" value="Great Barrington, Massachusetts" />
              <div id="endSuggestBox" class="suggest-box hidden"></div>
            </div>
          </div>

          <div class="grid2 coords-only">
            <label class="coords-only">Start Lat
              <input id="startLat" value="40.03" />
            </label>
            <label class="coords-only">Start Lon
              <input id="startLon" value="-75.22" />
            </label>
            <label class="coords-only">End Lat
              <input id="endLat" value="40.065" />
            </label>
            <label class="coords-only">End Lon
              <input id="endLon" value="-75.19" />
            </label>
          </div>

          <div class="preference-group">
            <div class="preference-switch" role="tablist" aria-label="Route preference">
              <button id="prefFastBtn" type="button" class="secondary" data-pref="fast">Fastest</button>
              <button id="prefBalancedBtn" type="button" class="active" data-pref="balanced">Balanced</button>
              <button id="prefScenicBtn" type="button" class="secondary" data-pref="scenic">Scenic</button>
            </div>
          </div>

          <div class="primary-actions">
            <button id="planBtn" type="button">Compare Route</button>
            <button id="swapBtn" type="button" class="secondary">Swap</button>
          </div>
          <div id="status" class="status-pill"></div>

          <section class="route-panel" id="routePanel" data-panel="routes">
            <div class="route-header">
              <div>
                <div class="route-title">Compare</div>
                <div class="route-sub">API output</div>
              </div>
              <div class="route-actions">
                <button id="routeCollapseBtn" class="ghost-btn" type="button">Hide</button>
              </div>
            </div>
            <div id="routeList" class="route-list"></div>
          </section>

          <div class="secondary-actions">
            <button id="shareRouteBtn" type="button" class="secondary">Share</button>
            <button id="clearBtn" type="button" class="secondary">Clear</button>
            <button id="saveRouteBtn" type="button" class="secondary">Save</button>
          </div>
          <div class="saved-trips">
            <div class="saved-title">Saved Trips</div>
            <div id="savedTrips" class="saved-list"></div>
          </div>
        </aside>

        <section class="card controls settings-panel menu-collapsed" data-panel="settings">
          <div class="sheet-header">
            <div class="sheet-grip" aria-hidden="true"></div>
            <div class="sheet-title">Layers</div>
            <button id="sheetToggleBtn" class="ghost-btn" type="button">Collapse</button>
          </div>
          <div class="control-group">
            <div class="group-title">Surface</div>
            <label>Region
              <select id="region"></select>
            </label>
            <div class="mode-switch map-style-switch" role="tablist" aria-label="Map style">
              <button id="mapStyleMapBtn" type="button" class="active" data-basemap="carto_voyager">Map</button>
              <button id="mapStyleSatelliteBtn" type="button" class="secondary" data-basemap="satellite">Satellite</button>
            </div>
            <label class="toggle-row">
              <input id="showHeatmap" type="checkbox" checked />
              <span>Show Scenic Layer</span>
            </label>
          </div>

          <div class="control-group">
            <div class="group-title">Route knobs</div>
            <label>Scenic Weight: <span id="weightValue">0.8</span>
              <input id="scenicWeight" type="range" min="0" max="1" step="0.05" value="0.8" />
            </label>
            <label>Max Detour Factor: <span id="detourValue">1.8</span>
              <input id="maxDetour" type="range" min="1.2" max="3.0" step="0.1" value="1.8" />
            </label>
          </div>

          <details class="advanced-settings">
            <summary>Advanced</summary>
            <div class="control-group">
              <div class="inline-actions">
                <button id="refreshRegionsBtn" type="button" class="secondary">Refresh Regions</button>
                <span id="apiHealth" class="pill">API: checking...</span>
              </div>
              <label>API Base URL
                <input id="apiBase" value="http://localhost:8080" />
              </label>
              <input id="basemapProvider" type="hidden" value="carto_voyager" />
              <span id="basemapStatus" class="pill">Basemap: loading...</span>
            </div>
          </details>

          <div class="hidden" aria-hidden="true">
            <button id="modeAddressBtn" type="button" class="active">Addresses</button>
            <button id="modeCoordsBtn" type="button" class="secondary">Coordinates</button>
          </div>
        </section>

        <nav class="mobile-tabs" aria-label="Primary">
          <button class="tab-btn active" type="button" data-tab="search">Plan</button>
          <button class="tab-btn" type="button" data-tab="routes">Compare</button>
          <button class="tab-btn" type="button" data-tab="settings">Layers</button>
        </nav>
      </section>
    </main>

    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script type="module" src="./app.js?v=demo-modules-v2"></script>
  </body>
</html>
